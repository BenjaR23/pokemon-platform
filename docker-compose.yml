services:
  postgres:
    image: postgres:17
    container_name: pokemon-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokemon_platform
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: